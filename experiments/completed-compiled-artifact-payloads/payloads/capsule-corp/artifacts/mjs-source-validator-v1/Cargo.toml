[package]
name = "capsule-mjs-source-validator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license-file = "LICENSE"
publish = false

[dependencies]
oxc_allocator = "=0.140.0"
oxc_ast = "=0.140.0"
oxc_ast_visit = "=0.140.0"
oxc_parser = "=0.140.0"
oxc_semantic = "=0.140.0"
oxc_span = "=0.140.0"
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
